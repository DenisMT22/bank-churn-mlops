name: CI - Prédiction de churn

# Aucun filtre de chemin : chaque poussée déclenche l'ensemble du pipeline.
# Un filtre laisserait passer sans contrôle un commit qui ne toucherait pas
# à src/, ce qui est précisément le cas d'un secret déposé à la racine.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: churn-prediction-api

jobs:
  # ========================================================================
  # Recherche de secrets. Sans dépendance : ce job doit tourner même si le
  # reste du pipeline échoue, et sur chaque poussée sans exception.
  # ========================================================================
  secret-scan:
    name: Scan de secrets
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          # Historique complet : le scan porte sur tous les commits, pas
          # seulement sur le dernier état des fichiers.
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scanner l'historique
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scanner les fichiers de travail
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner --verbose

  # ========================================================================
  # Style du code et analyse de sécurité statique.
  # ========================================================================
  lint:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les outils de qualité
        run: pip install ruff==0.1.9 bandit==1.7.6

      - name: Vérifier le style (ruff)
        run: ruff check .

      - name: Analyse de sécurité statique (bandit)
        run: bandit -r src/ streamlit_app.py -ll -q

  # ========================================================================
  # Tests. Le modèle est réellement entraîné à partir de la donnée source
  # versionnée, puis la suite de tests s'exécute contre cet artefact.
  # Aucun modèle factice, et aucun continue-on-error : un test rouge
  # arrête le pipeline.
  # ========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Entraîner le modèle depuis la donnée source
        run: python -m src.models.train --rapide --sans-figures

      - name: Vérifier que les artefacts sont bien produits
        run: |
          test -f models/trained/model_latest.pkl
          test -f models/preprocessor.pkl
          test -f models/model_metadata.json
          test -f data/processed/data_with_features.csv

      - name: Comparer les métriques régénérées à celles versionnées
        # Les métriques publiées doivent correspondre à ce que produit
        # réellement l'entraînement. La comparaison est numérique et non
        # octet à octet : deux machines différentes peuvent diverger sur
        # la dernière décimale sans que le modèle ait changé.
        run: |
          python - <<'PYTHON'
          import json, subprocess, sys

          versionne = json.loads(
              subprocess.check_output(
                  ["git", "show", "HEAD:models/model_metadata.json"], text=True
              )
          )
          with open("models/model_metadata.json") as fichier:
              regenere = json.load(fichier)

          tolerance = 1e-6
          ecarts = []
          for cle, attendu in versionne["metrics"].items():
              obtenu = regenere["metrics"].get(cle)
              if obtenu is None or abs(obtenu - attendu) > tolerance:
                  ecarts.append(f"  {cle} : versionné {attendu}, régénéré {obtenu}")

          if versionne["model_name"] != regenere["model_name"]:
              ecarts.append(
                  f"  modèle : versionné {versionne['model_name']}, "
                  f"régénéré {regenere['model_name']}"
              )

          if ecarts:
              print("Les métriques versionnées ne correspondent plus à l'entraînement :")
              print("\n".join(ecarts))
              print("Relancer `make train-complet` et committer models/model_metadata.json.")
              sys.exit(1)

          print("Métriques versionnées conformes à l'entraînement.")
          PYTHON

      - name: Vérifier qu'aucun autre fichier suivi n'a bougé
        run: |
          modifies=$(git status --porcelain -- . ':!models/model_metadata.json')
          if [ -n "$modifies" ]; then
            echo "L'entraînement a modifié des fichiers suivis :"
            echo "$modifies"
            exit 1
          fi
          echo "Aucun autre fichier suivi modifié."

      - name: Lancer la suite de tests
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture
          path: coverage.xml
          if-no-files-found: warn

  # ========================================================================
  # Construction de l'image Docker et vérification qu'elle démarre.
  # L'image est construite puis testée localement, elle n'est poussée vers
  # aucun registre : le pipeline reste indépendant de tout compte cloud.
  # ========================================================================
  docker-build:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances d'exécution
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Produire les artefacts attendus par l'image
        # Le preprocessor et le modèle ne sont pas versionnés : ils sont
        # régénérés ici pour être présents dans le contexte de build.
        run: python -m src.models.train --rapide --sans-figures

      - name: Construire l'image
        run: docker build -f deployment/Dockerfile -t ${{ env.IMAGE_NAME }}:ci .

      - name: Démarrer le conteneur
        run: docker run -d -p 8080:8080 --name api-ci ${{ env.IMAGE_NAME }}:ci

      - name: Vérifier que l'API répond
        run: |
          for tentative in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "L'API répond après $tentative tentative(s)."
              curl -s http://localhost:8080/health
              exit 0
            fi
            sleep 3
          done
          echo "L'API n'a pas répondu dans le délai imparti."
          docker logs api-ci
          exit 1

      - name: Vérifier une prédiction de bout en bout
        run: |
          reponse=$(curl -sf -X POST http://localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"credit_score":650,"country":"France","gender":"Female","age":35,"tenure":5,"balance":125000.0,"products_number":2,"credit_card":1,"active_member":1,"estimated_salary":50000.0}')
          echo "$reponse"
          echo "$reponse" | grep -q "churn_probability"

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f api-ci || true

  # ========================================================================
  # Déploiement Cloud Run, en sommeil.
  #
  # Ce job ne se déclenche QUE manuellement, depuis l'onglet Actions. Le
  # projet fonctionne entièrement en local et l'abonnement Google Cloud
  # associé n'est plus actif : un déclenchement automatique ferait échouer
  # le pipeline sans que rien ne soit cassé dans le code.
  #
  # Pour le réactiver, définir les secrets GCP_SA_KEY et GCP_PROJECT_ID
  # dans les réglages du dépôt, puis lancer le workflow à la main.
  # ========================================================================
  deploy:
    name: Déploiement Cloud Run (manuel)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch'

    env:
      REGION: europe-west1
      SERVICE_NAME: churn-prediction-api

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Produire les artefacts du modèle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m src.models.train --rapide --sans-figures

      - name: S'authentifier auprès de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Installer le SDK Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Autoriser Docker sur Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Construire et pousser l'image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}
          docker build -f deployment/Dockerfile -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Déployer sur Cloud Run
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --port 8080 \
            --set-env-vars ENVIRONMENT=production

      - name: Vérifier le service déployé
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Service déployé : $URL"
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$URL/health"
